<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cajas · El Cartel de las Donas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Cajas de El Cartel de las Donas: x6, x22, x30, pasteles y donas, y DONATÓN x 100. Pídelas por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a href="index.html" style="text-decoration:none"><b>El Cartel <span>de las Donas</span></b></a>
    <nav aria-label="Secciones">
      <a href="index.html#catalogo">Catálogo</a>
      <a href="cajas.html" aria-current="page">Cajas</a>
      <a href="index.html#contacto">Contacto</a>
    </nav>
  </div>
</header>

<main>
  <section class="cajas-sec pagina-cajas" id="cajas">
    <div class="wrap">
      <div class="eyebrow">Para compartir</div>
      <h1 style="font-size:clamp(2.4rem,6vw,3.6rem)">Cajas del cartel</h1>
      <p class="lead">Cada caja se pide directo por WhatsApp; no va en el carrito de las donas. Te confirmamos sabores y entrega por chat.</p>
      <div class="cajas" id="lista-cajas"></div>
      <a class="btn volver" href="index.html">← Volver al inicio</a>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>UNIDOS · El Cartel de las Donas</span>
    <span>Hoy, cada dona cuenta.</span>
  </div>
</footer>

<script>
  // Cajas editables: cambia nombres, precios, descripciones o fotos aquí.
  const WHATSAPP = "573052227062";
  const CAJAS = [
    { nombre: "CAJA x 6", precio: 30000, desc: "6 donas para antojarse.", img: "img/caja-x6.jpg" },
    { nombre: "CAJA x 22", precio: 100000, desc: "22 donas para la oficina o la familia.", img: "img/caja-x22.jpg" },
    { nombre: "CAJA x 30", precio: 135000, desc: "30 donas para la fiesta.", img: "img/caja-x30.jpg" },
    { nombre: "CAJA Pasteles y Donas", precio: 100000, desc: "Lo dulce y lo salado en una sola caja.", img: "img/caja-pasteles-donas.jpg" },
    { nombre: "DONATÓN x 100", precio: 430000, desc: "50 donas y 50 pasteles para eventos grandes.", img: "img/donaton-x100.jpg", destacada: true }
  ];
  const pesos = n => "$" + n.toLocaleString("es-CO");
  const wa = texto => `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(texto)}`;
  document.getElementById("lista-cajas").innerHTML = CAJAS.map(c => `
    <article class="caja${c.destacada ? " destacada" : ""}">
      <img src="${c.img}" alt="${c.nombre}" loading="lazy">
      <div class="caja-body">
        <h3>${c.nombre}</h3>
        <p>${c.desc}</p>
        <span class="precio">${pesos(c.precio)}</span>
        <a class="btn wa" href="${wa("Quiero pedir " + c.nombre)}" target="_blank" rel="noopener">Pedir por WhatsApp</a>
      </div>
    </article>`).join("");
</script>
</body>
</html>
