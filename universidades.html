<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Universidades · El Cartel de las Donas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Universidades donde vende El Cartel de las Donas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap">
<link rel="stylesheet" href="estilos.css">
<script>document.documentElement.classList.add("js");</script>
</head>
<body>
<header class="top"></header>

  <div class="pagina-cabeza amarillo">
    <div class="wrap">
      <div class="eyebrow">Dónde nos encuentras</div>
      <h1>Universidades</h1>
      <p class="lead">También vendemos en estas universidades.</p>
    </div>
  </div>
<main>
  <section>
    <div class="wrap">
      <ul class="universidades grande" id="lista-universidades"></ul>
      <div class="u-botones">
        <div class="u-boton reveal">
          <h2 id="u-vender-titulo"></h2>
          <p id="u-vender-texto"></p>
          <a class="btn grande amarillo" id="u-vender-btn" href="unete.html"></a>
        </div>
        <div class="u-boton domi reveal" style="--d:80ms">
          <span class="u-icono" aria-hidden="true">🛵</span>
          <h2 id="u-domi-titulo"></h2>
          <p id="u-domi-texto"></p>
          <a class="btn grande wa" id="u-domi-btn" href="#" target="_blank" rel="noopener"><span class="ico-wa" aria-hidden="true"></span> <span id="u-domi-btn-txt"></span></a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="pie"></footer>
<script src="datos.js"></script>
<script src="sitio.js"></script>
<script>
  $("lista-universidades").innerHTML = UNIVERSIDADES.map((u, i) => `<li class="reveal" style="--d:${i * 50}ms"><span aria-hidden="true">🎓</span> ${esc(u)}</li>`).join("");
  const ub = UNIVERSIDADES_BOTONES;
  $("u-vender-titulo").textContent = ub.vender.titulo;
  $("u-vender-texto").textContent = ub.vender.texto;
  $("u-vender-btn").textContent = ub.vender.boton;
  $("u-domi-titulo").textContent = ub.domi.titulo;
  $("u-domi-texto").textContent = ub.domi.texto;
  $("u-domi-btn-txt").textContent = ub.domi.boton;
  $("u-domi-btn").href = waLink(WHATSAPP_PEDIDOS, ub.domi.mensaje);
  animarEntradas();
</script>
</body>
</html>
